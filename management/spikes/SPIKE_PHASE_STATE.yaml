# SPIKE PHASE STATE — machine-readable
#
# Owner of this file: CHAT A - PROJECT CONTROL (leader-operated).
# Authoritative readiness context: management/readiness/READINESS_REVIEW_RESOLUTION.md section 10.
#
# RULES
#   - STATUS SEMANTICS (corrected): ACTIVE means ACTUAL EXECUTION HAS STARTED. An authorised and assigned
#     spike whose owner has not started, and whose started_at is null, is PREPARED - never ACTIVE.
#     When an owner actually starts: set status to ACTIVE and record the real started_at. NEVER backdate it.
#   - status ACCEPTED requires real evidence in RESULT.md, reviewer APPROVE, and a QA Red Team PASS.
#     See acceptance_workflow. Never set it otherwise.
#   - The `review.state` field is the REVIEW state and is independent of the spike execution `status`.
#   - Values marked UNVERIFIED must be captured from the real device/hardware, never inferred.
#   - Claude must not populate any measurement field. See SPIKE_PHASE_PLAN.md section 0.

schema_version: 1

phase:
  name: SPIKE_PHASE
  status: OPEN
  opened_at: "2026-09-08"
  authorised_by: "Team Leader"
  preceded_by: "Readiness Decision Phase (ACCEPTED and CLOSED)"
  project_verdict: READY_WITH_CONDITIONS
  wave: 1

  authorised_outputs:
    - spike task and control artifacts
    - harness / instrumentation / fixture / measurement-script preparation
    - execution coordination of authorised spikes

  explicitly_not_authorised:
    - MASTER_PLAN_30_DAYS.md
    - day-1 production feature plan
    - final repository architecture
    - final mobile stack choice          # GATE-MOB-01 needs Spike A + B evidence
    - final DINOv2 recipe                # GATE-ML-01 needs Spike C1 evidence
    - production feature implementation
    - any edit to docs/specs/v1.0/

execution_state_semantics:
  NOT_STARTED:     "not yet prepared"
  PREPARED:        "authorised and assigned; task + evidence template exist; harness/prep work may proceed; execution NOT started; started_at is null"
  ACTIVE:          "the owner has ACTUALLY STARTED work; started_at records the real date/time"
  BLOCKED:         "cannot proceed; blocked_by names the dependency"
  EVIDENCE_READY:  "RESULT.md exists with real measurements; awaiting Secondary Reviewer"
  NEEDS_FIX:       "reviewer or QA rejected the evidence; owner corrects or gathers more"
  ACCEPTED:        "reviewer APPROVE + QA Red Team PASS + Project Control transition"
  NEGATIVE_RESULT: "the spike ran correctly and the answer is 'no'. A valid, valuable outcome."
  rule: "Do not label a spike ACTIVE to express authorisation. Authorisation is PREPARED."

review_state_semantics:
  note: "Independent of the spike execution `status` field. Tracks the review workflow only."
  NOT_REQUESTED:     "no evidence submitted yet"
  QUEUED_FOR_REVIEW: "evidence ready, but the reviewer's single review slot is occupied"
  REVIEWING:         "occupying the reviewer's one active review slot"
  APPROVED:          "reviewer approved; proceeds to QA Red Team challenge"
  NEEDS_FIX:         "reviewer rejected; returns to the owner"

readiness_conditions_open:
  C1:
    description: "Spike D completes; DATASET_AUDIT.md + manifest ACCEPTED, resolving GATE-DATA-01 and Path A/B provenance"
    unblocked_by: SPIKE_D
  C4:
    description: "RA-B01 resolved - 3D error pipeline defined on Spike F evidence, or explicit scope decision"
    unblocked_by: SPIKE_F
  C6:
    description: "Axis-aligned-only policy approved (DR-012); confirmation against the actual validated package still required"
    state: PARTIALLY_RESOLVED
    unblocked_by: SPIKE_D
    warning: "Do NOT mark C6 CLOSED before Spike D evidence exists."

readiness_conditions_closed: [C2, C3, C5, C7, C8]

