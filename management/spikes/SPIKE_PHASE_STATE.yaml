acceptance_workflow:
  rule: "No spike becomes ACCEPTED merely because RESULT.md exists."
  sequence:
    - step: 1
      actor: "Primary Owner"
      action: "Executes the spike and records real evidence in RESULT.md"
      result_state: EVIDENCE_READY
    - step: 2
      actor: "Secondary Reviewer"
      action: "Technical / evidence review; occupies the reviewer's single REVIEWING slot"
      outcome: [APPROVE, NEEDS_FIX]
      on_needs_fix: >
        Spike returns to NEEDS_FIX. Owner corrects or gathers additional evidence. A known-invalid claim must
        NOT be forwarded to final acceptance.
    - step: 3
      actor: "CHAT E - QA / Red Team"
      action: "Independently challenges the evidence"
      outcome: [PASS, REJECT]
      on_reject: "Spike is NOT ACCEPTED regardless of owner or reviewer opinion."
      evidence_inspection_required_for: [SPIKE_D, SPIKE_B, SPIKE_F]
      evidence_inspection_note: >
        For evidence-driven gates, QA must inspect the ACTUAL RECORDED EVIDENCE relevant to the gate - not
        only the summary verdict.
    - step: 4
      actor: "CHAT A - Project Control"
      action: "Performs the final state transition"
      result_state: ACCEPTED

