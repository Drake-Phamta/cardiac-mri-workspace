          ZeroTier overlay address; the owner drives it from his own machine. Control travels over
          USB, so the phone's Wi-Fi stays OFF and measured traffic goes over real cellular - which
          is what E1 requires and why the control channel is deliberately not on the overlay.
          Under this model "executed by <owner>" holds and none of the constraints below trigger.
        primary_model_cost: >
          The leader's PC must be powered and reachable during the session, and an adb server on
          the overlay is controllable by anyone on that network. The overlay is authenticated and
          members-only (DR-003a), so exposure is bounded to the team - but it is real. Opened for
          a session, closed after, and the session recorded.
        fallback_model: >
          Leader operates, owner interprets. Only when the remote session is not possible. The
          four constraints below then apply to that spike, for that evidence.
        constraints_that_make_it_valid:
          - "Pham Tuan Anh withdraws as SPIKE_E Secondary Reviewer where he operated the device"
          - "E10, E11 and E13 are written by Nguyen Gia Duc Trung"
          - "Trung personally reproduces at least one run before SPIKE_E can be ACCEPTED"
          - "Ownership does not move - Trung remains SPIKE_E Primary Owner"
        preferred_alternative: >
          A scheduled session in which the spike owner operates the device himself satisfies every
          criterion without invoking DR-006a. Take it where possible."
        revision_2_2026_09_13: >
          SPIKE_E ONLY. The leader is the sole device operator; Trung no longer touches the phone.
          Constraints a, b, d apply in full. Constraint c (Trung reproduces a run ON THE DEVICE) is
          impossible under that decision and is REPLACED: Trung runs the same harness end-to-end on a
          diagnostic path (done 2026-09-13, AVD) AND independently re-runs aggregate.py on the
          leader's raw device logs and reproduces the numbers. Cost recorded: on-device evidence has
          one operator and no second-person device reproduction. SPIKE_B / SPIKE_F not decided here.
          Record: management/readiness/OPEN_DECISIONS.md, "DR-006a - REVISION 2".
        constraint_c_as_of_revision_2: "Trung reproduces the pipeline on a diagnostic path AND re-aggregates the leader's raw logs to the same numbers"
      see: device_measurement_queue

review_serialization:
  rule: "A member may have at most ONE review in REVIEWING state at a time. A second assignment stays QUEUED_FOR_REVIEW."
  ownership_change_permitted: false     # do not reassign reviewers to dodge scheduling
  # That prohibition is about SCHEDULING, in those words: SPIKE_PHASE_PLAN.md says "Reviewer
  # ownership must not be changed merely to eliminate the scheduling conflict." It is not a
  # prohibition on removing a reviewer who can no longer be independent.
  reassignments:
    - date: "2026-09-12"
      spike: SPIKE_E
      from: "Pham Tuan Anh"
      to: "Vu Hung Anh"
      reason: "CONFLICT OF INTEREST, not scheduling"
      basis: >
        DR-006a as first written made Pham Tuan Anh the device OPERATOR for SPIKE_E. Producing the
        measurements and then reviewing them is self-approval under two role names.
      status: REVERTED
      reverted_at: "2026-09-12"
      reverted_because: >
        DR-006a revision 1 replaced that model. The team is dispersed, so the first version's
        "preferred alternative" - a session where the owner operates the device in person - does
        not exist. What does exist is the owner operating it REMOTELY: the leader keeps the phone
        on USB and exposes the adb server on his ZeroTier address, and the owner drives it from
        his own machine. Control travels over USB so the phone's Wi-Fi stays off and the measured
        traffic still goes over real cellular, which E1 requires. The leader no longer produces
        the evidence, so the recusal has no basis.
        Kept here rather than deleted: the reassignment happened and was committed. It is reversed
        because its premise turned out to be false, not because it was wrong on what was known.
    - date: "2026-09-12"
      spike: SPIKE_E
      from: "Vu Hung Anh"
      to: "Pham Tuan Anh"
      reason: "reverts the entry above - DR-006a revision 1"
      conditional_rule: >
        If a remote session is not possible for a given measurement and the leader operates the
        device himself, the recusal applies to THAT spike for THAT evidence. It is conditional on
        who actually operated, and the evidence file records the operator.
    - date: "2026-09-13"
      spike: SPIKE_E
      from: "Pham Tuan Anh"
      to: "Vu Hung Anh"
      reason: "CONFLICT OF INTEREST, not scheduling - DR-006a revision 2"
      basis: >
        The leader decided to be the SOLE operator of every SPIKE_E device measurement. He produces
        the evidence, so he cannot review it (constraint a). This time the premise is the leader's
        own standing decision, not a model that might be replaced - so no revert is expected.
      load_note: >
        Vu Hung Anh now holds five review assignments (D, A, C0, C1, E) on top of owning SPIKE_B and
        SPIKE_F. Serialization still applies: one REVIEWING at a time.
  commit_hygiene_note: >
    The rationale for the first reassignment was committed to the spike-b branch by mistake on
    2026-09-12 00:31 instead of to main, so for several hours main carried the reviewer change
    with no recorded reason sitting directly under a flag that says reviewers are not reassigned.
    Recorded rather than silently tidied.
  reviewers:
    "Vu Hung Anh":
      reviews: [SPIKE_D, SPIKE_A, SPIKE_C0, SPIKE_C1, SPIKE_E]   # SPIKE_E added 2026-09-12, reverted, added again 2026-09-13 (DR-006a rev 2)
      default_priority: [SPIKE_D, SPIKE_A, SPIKE_E]
      rationale: "SPIKE_D before SPIKE_A because SPIKE_D is P0."
      pre_emption_rule: >
        If SPIKE_A becomes EVIDENCE_READY while SPIKE_D is not ready, Vu MAY review SPIKE_A. However, once
        SPIKE_D becomes EVIDENCE_READY, SPIKE_D receives priority for the next available review slot.
      currently_reviewing: null
      queued: []
    "Pham Tuan Anh":
      reviews: [SPIKE_B, SPIKE_F]   # SPIKE_E removed 2026-09-13, DR-006a rev 2 - he operates the device.
                                   # History: removed and restored 2026-09-12 (rev 1).
                                         # DR-006a revision 1: the owner operates the device
                                         # REMOTELY over adb, so the leader does not produce that
                                         # evidence and constraint (a) does not bite. See
                                         # review_serialization.reassignments for both moves.
      default_priority: [SPIKE_B, SPIKE_E]
      rationale: >
        SPIKE_B before SPIKE_E because SPIKE_B is P1 and feeds GATE-MOB-01 and DR-008c directly, while
        SPIKE_E is P2.
      pre_emption_rule: >
        If SPIKE_E becomes EVIDENCE_READY while SPIKE_B is not ready, Pham MAY review SPIKE_E. Once SPIKE_B
        becomes EVIDENCE_READY, SPIKE_B receives priority for the next available review slot.
      currently_reviewing: null
      queued: []

