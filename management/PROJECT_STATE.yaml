# --- INTEGRITY --------------------------------------------------------------
integrity:
  frozen_spec_checksums: "19/19 OK"     # verified 2026-09-12 00:05, after .gitattributes
  checksum_check_caveat: >
    Before 2026-09-12 this check could pass for a reason unrelated to the files being
    correct. core.autocrlf=true rewrites LF to CRLF on checkout, and sha256sum -c hashes
    the WORKING COPY - so a file git had not re-materialised still had its original
    endings and passed by accident, while one it had touched failed despite a perfect
    blob. .gitattributes now marks docs/specs/v1.0/** as -text, so the working copy is
    byte-identical to the blob on every platform. CI on ubuntu-latest was never affected,
    which is why this went unnoticed for three days.
  qa_review:
    record: management/day03/QA_REVIEW_001.md
    date: "2026-09-12"
    scope: "the four tooling packages built overnight - Spike D, B, E, C0"
    findings: 49
