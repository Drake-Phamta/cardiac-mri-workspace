    method: "adversarial, executed against deliberately broken inputs - not a read-through"
    note: >
      Every CRITICAL was of one kind: a harness producing a wrong number that looked right.
      One of them, the Spike B B14 group difference, had already been published to the
      spike owner and was retracted in public rather than quietly corrected.
