name: guardrails

# Automates the invariants Project Control has been checking by hand since Day 0.
#
#   NFR-MAINT-001 / -002 / -003  -- the Integration/CI block
#
# Four independent jobs on purpose: when something breaks, the job name says
# WHICH invariant broke without anyone reading a log.
#
# No third-party actions beyond actions/checkout and actions/setup-python. A
# repository governed by `12` section 6 should not grow a supply-chain surface
# to check its own checksums.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:

  # --------------------------------------------------------------------------
  spec-integrity:
    name: "frozen spec checksums (19/19)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: verify every checksum AND the count
        run: |
          cd docs/specs/v1.0
          # sha256sum -c exits 0 on a manifest that lists nothing, and on one
          # that silently lost a line. Both would be a pass that means nothing,
          # so the count is asserted too. 19 is the frozen size of spec v1.0.
          sha256sum -c SPEC_MANIFEST_SHA256.txt | tee /tmp/spec.txt
          ok=$(grep -c ': OK$' /tmp/spec.txt || true)
          echo "checksums OK: $ok"
          if [ "$ok" -ne 19 ]; then
            echo "::error::expected 19 OK lines, got $ok - the manifest itself may have changed"
            exit 1
          fi

  # --------------------------------------------------------------------------
  spec-frozen:
    name: "no PR touches docs/specs/v1.0"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: diff against the base and refuse spec edits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "push build - comparing against the previous commit"
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            HEAD=$(git rev-parse HEAD)
          fi
          echo "base $BASE"
          echo "head $HEAD"
          changed=$(git diff --name-only "$BASE" "$HEAD" -- 'docs/specs/v1.0/**' || true)
          if [ -n "$changed" ]; then
            echo "::error::this change touches the frozen specification:"
            echo "$changed"
            echo ""
            echo "Specification v1.0 is frozen. `00` section 13 sets the only route:"
            echo "  Problem -> Decision Request -> impact analysis -> leader approval"
            echo "  -> specification update -> implementation"
            echo ""
            echo "An amendment to an APPROVED decision goes in"
            echo "management/readiness/OPEN_DECISIONS.md Part 2b instead - see DR-001a,"
            echo "DR-003a. That route needs no spec edit and keeps checksums at 19/19."
            exit 1
          fi
          echo "no spec file touched"

  # --------------------------------------------------------------------------
  state-parses:
    name: "central state files parse"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyyaml

      - name: parse the state files and re-assert the invariants
        run: |
          python - <<'PY'
          import sys, yaml, pathlib

          problems = []

          def load(p):
              path = pathlib.Path(p)
              if not path.exists():
                  problems.append(f"{p} is missing")
                  return None
              try:
                  return yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  problems.append(f"{p} does not parse: {exc}")
                  return None

          spikes = load("management/spikes/SPIKE_PHASE_STATE.yaml")
          project = load("management/PROJECT_STATE.yaml")

          if spikes:
              by_id = {s["id"]: s for s in spikes.get("spikes", [])}

              # A spike cannot be ACTIVE without a real started_at. The state
              # file's own header forbids backdating, and a null start with an
              # ACTIVE status is how that rule gets quietly broken.
              for sid, s in by_id.items():
                  if s.get("status") == "ACTIVE" and not s.get("started_at"):
                      problems.append(f"{sid} is ACTIVE with no started_at")
                  if s.get("status") == "ACCEPTED" and not s.get("evidence_present"):
                      problems.append(f"{sid} is ACCEPTED with evidence_present false")

              # SPIKE_C1 may not leave BLOCKED while SPIKE_D is unaccepted.
              c1, d = by_id.get("SPIKE_C1"), by_id.get("SPIKE_D")
              if c1 and d and c1.get("status") != "BLOCKED" and d.get("status") != "ACCEPTED":
                  problems.append(
                      f"SPIKE_C1 is {c1.get('status')} while SPIKE_D is {d.get('status')} "
                      "- C1 is blocked by D until D is ACCEPTED")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print("state files parse and their invariants hold")
          PY

  # --------------------------------------------------------------------------
  geometry-contract:
    name: "canonical geometry contract (TC-MAINT-002)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: verify canonical fixture and exact contract version
        run: |
          python spikes/spike_b_3d/harness/conformance.py \
            --fixture tests/fixtures/geometry/geometry_fixture_v0.json \
            --expect-contract-version dr008a-dr012/v1.0.0 \
            --implementation-name reference

  # --------------------------------------------------------------------------
  no-forbidden-bytes:
    name: "no dataset / checkpoint / secret bytes"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: scan files added by this change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            HEAD=$(git rev-parse HEAD)
          fi
          added=$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" || true)
          fail=0

          # `12` section 3 / `06` section 5: dataset bytes are never committed.
          bad=$(echo "$added" | grep -Ei '\.(nrrd|nii|nii\.gz|dcm|mha|mhd|raw)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::dataset bytes must never be committed (12 section 3, 06 section 5):"
            echo "$bad"; fail=1
          fi

          # `08` section 10: checkpoints are referenced by id/checksum, not committed.
          bad=$(echo "$added" | grep -Ei '\.(pt|pth|ckpt|safetensors|onnx)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::model weights are referenced by id/checksum, not committed:"
            echo "$bad"; fail=1
          fi

          # NFR-SEC-004: secrets are never committed.
          bad=$(echo "$added" | grep -Ei '(^|/)\.env($|\.)|\.(pem|key|p12|keystore|jks)$' \
                | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::secrets must not be committed (NFR-SEC-004, 12 section 6):"
            echo "$bad"; fail=1
          fi

          # A large file is usually a dataset or a build artifact that slipped
          # past .gitignore. Spike evidence is text; 10 MB is generous for it.
          for f in $added; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt 10485760 ]; then
              echo "::error::$f is $((size / 1048576)) MB. Large artifacts stay out of git;"
              echo "          record a checksum and the command that regenerates them."
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "no forbidden bytes in this change"

  # --------------------------------------------------------------------------
  app-core:
    name: "app/core tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ubuntu-latest ships node; no setup-node action, for the same
      # supply-chain reason the header gives. The version is printed so a
      # failure that turns out to be a runtime difference is diagnosable.
      - name: record the runtime
        run: node --version

      # The bundle is generated, never committed (fixture_rules
      # .handwritten_fixtures_allowed = false), so CI builds it from the
      # contract with the project's own generator before the tests run.
      - name: generate the fixture bundle from the contract
        run: |
          mkdir -p app/core/fixtures/.generated
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "contracts/api")
          from generate_fixture import generate_fixture
          with open("contracts/api/contract.json", encoding="utf-8") as fh:
              contract = json.load(fh)
          bundle = generate_fixture(contract)
          with open("app/core/fixtures/.generated/api_bundle.json", "w", encoding="utf-8") as fh:
              json.dump(bundle, fh, indent=2)
          print(f"generated {len(bundle['endpoints'])} endpoints, "
                f"{len(bundle.get('scenarios', {}))} with scenarios")
          PY

      - name: run every app/core test script
        run: node app/core/tests/run_all.mjs

  # --------------------------------------------------------------------------
  app-framework-neutral:
    name: "app/core stays framework-neutral (GATE-MOB-01)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GATE-MOB-01 is still open: Spike A and Spike B are not both ACCEPTED,
      # so TECH_STACK_ADR does not exist and no framework has been chosen.
      # app/core is written so the four verticals can start anyway. This job
      # is what stops that neutrality from decaying the first time someone is
      # in a hurry - by then three verticals would depend on the choice.
      #
      # Delete this job when the ADR lands AND the team decides core may bind
      # to the chosen framework. Deleting it silently is the failure mode.
      - name: refuse framework imports, npm dependencies and spike imports
        run: |
          fail=0
          files=$(find app -name '*.mjs' -o -name '*.js' | sort)
          echo "scanning:"; echo "$files" | sed 's/^/  /'

          bad=$(grep -REn "from ['\"](react|react-native|react-dom|expo|flutter|@react-native|vue|svelte|next)" \
                  --include='*.mjs' --include='*.js' app/core || true)
          if [ -n "$bad" ]; then
            echo "::error::app/core must not import a UI framework while GATE-MOB-01 is open:"
            echo "$bad"; fail=1
          fi

          # Any bare specifier is an npm dependency, because app/ has no
          # package.json to resolve one. node: builtins are allowed, and only
          # under app/core/node/.
          bad=$(grep -REn "^\s*import .* from ['\"][^./]" --include='*.mjs' --include='*.js' app \
                  | grep -v "from ['\"]node:" || true)
          if [ -n "$bad" ]; then
            echo "::error::app/ has no package.json; every import must be relative:"
            echo "$bad"; fail=1
          fi

          bad=$(grep -REn "from ['\"]node:" --include='*.mjs' app/core \
                  | grep -v '^app/core/node/' | grep -v '^app/core/tests/' || true)
          if [ -n "$bad" ]; then
            echo "::error::node: builtins belong in app/core/node/ only - a device bundle has no node:fs:"
            echo "$bad"; fail=1
          fi

          # Spike code is labelled throwaway and lives behind its own boundary.
          # Reuse is by copy with a provenance header (see app/core/viewMath.mjs).
          bad=$(grep -REn "spikes/" --include='*.mjs' --include='*.js' app/core \
                  | grep -E "^[^:]+:[0-9]+:\s*(import|export)" || true)
          if [ -n "$bad" ]; then
            echo "::error::app/core must not import from spikes/ - copy with provenance instead:"
            echo "$bad"; fail=1
          fi

          bad=$(find app -name package.json -o -name 'package-lock.json' -o -name 'metro.config.js' \
                  -o -name 'vite.config.*' -o -name 'webpack.config.*' -o -name 'pubspec.yaml' || true)
          if [ -n "$bad" ]; then
            echo "::error::a manifest or bundler config under app/ pre-empts the ADR:"
            echo "$bad"; fail=1
          fi

          # DR-010 gave worst-slice ranking to the API: "the API returns the
          # selection; the client never re-derives it."
          #
          # Anchored so it cannot match its own documentation: selection.mjs
          # says in a comment that it contains no `.sort(`, and a naive grep
          # fails on that line. The authoritative check is P1 in
          # app/core/tests/test_readers.mjs, which strips comments properly;
          # this is the cheap second net at the boundary.
          bad=$(grep -nE '^[^*/]*\.sort\(' app/core/selection.mjs || true)
          if [ -n "$bad" ]; then
            echo "::error::selection.mjs must not rank slices (DR-010):"
            echo "$bad"; fail=1
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "app/core is framework-neutral, dependency-free and does not re-derive the selection"
