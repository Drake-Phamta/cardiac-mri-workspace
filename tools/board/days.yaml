    - "**ZeroTier Android không tự hồi phục khi đổi mạng** — phải tắt/bật network trong app. Rủi ro ngày demo."
    - "**Payload đang giả định sai**: `int16` 58 MB; volume thật `uint8` ~29 MB (576²) và ~36 MB (640²). Số theo byte phải đo lại."
    - "Lượt 3–4 **không phải LAN**: điện thoại ở `192.168.0.0/24`, Mac mini ở `10.170.75.0/24` — đường WAN thật."

