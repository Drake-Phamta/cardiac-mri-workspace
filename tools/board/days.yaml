# Narrative for the execution board. The NUMBERS are not here.
#
# Anything derivable - spike status, gates, conditions, the reviewer matrix,
# buffer days, ACCEPTED count - is read from management/PROJECT_STATE.yaml and
# management/spikes/SPIKE_PHASE_STATE.yaml by build_board.py. Duplicating those
# here is how a board starts telling a different story from the repository.
#
# What lives here is the part no state file knows: what each person is being
# asked to do, and what actually happened on a given day.
#
# RULE, the same one DAY_LOG.md carries: a "done" line needs a traceable
# reference - a commit SHA, a PR number, or a committed file path. No evidence,
# no done.

