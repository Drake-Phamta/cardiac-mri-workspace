<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cardiac MRI · 3D segmentation surface</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050a10; color: #dce6f2; }
      body { display: block; }
      main { position: relative; width: 100%; height: 100%; }
      header { display: none; }
      h1 { font-size: 1rem; margin: 0; letter-spacing: .02em; }
      #status { color: #91a4b8; font-size: .75rem; text-align: right; }
      .stage { position: absolute; inset: 0; overflow: hidden; background: #050a10; }
      canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      .clinical-label { position: absolute; top: .7rem; left: .7rem; padding: .42rem .55rem; border: 1px solid #344958; border-radius: 5px; background: #080f17dc; color: #a7c2d0; font-size: .62rem; letter-spacing: .08em; line-height: 1.5; pointer-events: none; }
      .clinical-label b { display: block; color: #e3edf2; font-size: .69rem; }
      .hint { position: absolute; right: .65rem; bottom: .55rem; color: #8193a2; font-size: .62rem; pointer-events: none; }
      .controls { position: absolute; left: .65rem; right: .65rem; bottom: .55rem; display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; color: #91a4b8; font-size: .62rem; }
      #pick { flex-basis: 100%; min-height: 1em; color: #9eeaf0; }
      button { border: 1px solid #38516d; border-radius: 5px; background: #162538; color: #dce6f2; padding: .4rem .65rem; font: inherit; cursor: pointer; }
      button:hover { background: #203751; }
      .badge { margin-left: auto; color: #9cb0bd; }
    </style>
  </head>
  <body>
    <main>
      <header><h1>CARDIAC MRI · SEGMENTATION</h1><div id="status">loading surface…</div></header>
      <div class="stage">
        <canvas id="gl" aria-label="Interactive 3D mesh"></canvas>
        <div class="clinical-label"><b>LABEL-DERIVED SURFACE</b>RAS · source slices linked</div>
        <div class="hint">verified triangle → source-slice map · drag orbit · wheel zoom</div>
      </div>
      <div class="controls">
        <button id="fit" type="button">fit camera</button>
        <button id="shade" type="button">shading: on</button>
        <span id="pick">pick: click the surface to resolve a source voxel</span>
      </div>
    </main>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
